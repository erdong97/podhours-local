name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate app icon
        run: python3 tools/make_icon.py PodsStats/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify stats engine
        run: |
          swiftc -O PodsStats/Stats.swift Tests/StatsCheck/main.swift -o /tmp/statscheck
          /tmp/statscheck | tee stats-check.log

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project PodsStats.xcodeproj -scheme PodsStats \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Ad-hoc sign with entitlements
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          codesign --force --sign - --entitlements PodsStats/PodsStats.entitlements --timestamp=none "$APP"
          echo "--- embedded entitlements ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PodsStats.ipa Payload
          ls -lh PodsStats.ipa
          unzip -l PodsStats.ipa | head -30

      - name: Push result to dist branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/distout
          cp PodsStats.ipa /tmp/distout/ 2>/dev/null || true
          cp build.log /tmp/distout/ 2>/dev/null || true
          cp stats-check.log /tmp/distout/ 2>/dev/null || true
          echo "job status: ${{ job.status }} / commit: ${{ github.sha }} / $(date -u)" > /tmp/distout/build-status.txt
          cd /tmp/distout
          git init -b dist -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "build result for ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dist

      - name: Publish IPA to release v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1 --yes || true
          gh release create v1 PodsStats.ipa \
            --title "PodsStats 个人版 IPA" \
            --notes "未签名 IPA：用你自己的证书自签后安装（全能签 / Sideloadly / iLoader 等）。App 完全离线，无任何联网代码。"
