name: PodHours
options:
  bundleIdPrefix: com.erdong97
  deploymentTarget:
    iOS: "16.0"
targets:
  PodHours:
    type: application
    platform: iOS
    sources:
      - path: PodHours
    info:
      path: PodHours/Info.plist
      properties:
        CFBundleDisplayName: PodHours
        NSHealthShareUsageDescription: "读取你的耳机音频暴露记录，统计每副耳机的聆听时长。所有数据只在本机处理，不联网、不上传。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: PodHours/PodHours.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erdong97.podhours
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    scheme:
      build:
        targets:
          PodHours: all
